# Render Blueprint.
#
# Lives at the repository root because that is the only place Render's Blueprint
# feature looks for it — the file used to sit in backend/, where it was never
# found. `rootDir` below is what points the build back at the backend folder, so
# the frontend/ directory in this repo is cloned but otherwise ignored here; it
# deploys separately on Vercel.

services:
  - type: web
    name: skyvayu-backend
    runtime: node
    plan: free
    rootDir: backend
    # `npm install`, not `npm ci`. ci refuses to run at all if it cannot see a
    # package-lock.json — which is exactly how the first deploy failed, with
    # "can only install with an existing package-lock.json" even though the file
    # is committed. install builds the tree either way, so a lockfile that the
    # host resolves differently degrades to a slower install instead of a failed
    # deploy. The Node version is pinned in backend/.node-version for the same
    # reason: engines said ">=18", so Render picked 26.x, whose npm behaves
    # differently from the one this lockfile was written by.
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render assigns PORT itself — config/env.js reads whatever it injects.
      - key: TRUST_PROXY
        value: 1

      # ── Secrets: set these in the Render dashboard, never in this file ──────
      # sync: false keeps the value out of the repo and out of blueprint syncs.
      # Direct Postgres URI — migrations only. Use the direct/session-mode
      # string, not the transaction pooler.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Signing secret for the Razorpay webhook, set when the webhook is created
      # in the dashboard. Not the same value as RAZORPAY_KEY_SECRET.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Comma-separated production frontend origins, no trailing slash:
      #   https://skyvayu.com,https://www.skyvayu.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # SMS provider for phone verification. Without a working provider the
      # charter form cannot be submitted at all, and the API refuses to boot
      # with SMS_PROVIDER=console in production. Indian numbers additionally
      # require TRAI DLT registration — see backend/.env.example.
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_GATEWAY_URL
        sync: false
      - key: SMS_GATEWAY_METHOD
        sync: false
      - key: SMS_GATEWAY_BODY
        sync: false
      - key: SMS_GATEWAY_USER
        sync: false
      - key: SMS_GATEWAY_PASS
        sync: false
      # Must match the DLT-approved wording exactly, with {otp} for {#var#}.
      - key: SMS_TEMPLATE
        sync: false
      - key: DLT_TE_ID
        sync: false
      - key: DLT_PE_ID
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

      # ── Non-secret defaults ────────────────────────────────────────────────
      - key: EMAIL_FROM
        value: noreply@skyvayu.com
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
